name: App Store Build Upload

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  archive_upload:
    name: Archive and upload signed App Store build
    runs-on: macos-26
    env:
      APP_IDENTIFIER: com.staycheckiq.app
      TEAM_ID: 5ZP6GV85J6
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required App Store Connect secrets
        run: |
          test -n "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}"
          test -n "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          test -n "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          API_KEY_JSON="$RUNNER_TEMP/asc-api-key.json"
          export KEY_PATH API_KEY_JSON
          printf "%s" "$APP_STORE_CONNECT_API_PRIVATE_KEY" | perl -pe 's/\\n/\n/g' > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          {
            echo "KEY_PATH=$KEY_PATH"
            echo "API_KEY_JSON=$API_KEY_JSON"
          } >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          key_path = Path(os.environ["KEY_PATH"])
          payload = {
              "key_id": os.environ["APP_STORE_CONNECT_API_KEY_ID"],
              "issuer_id": os.environ["APP_STORE_CONNECT_ISSUER_ID"],
              "key": key_path.read_text(),
              "in_house": False,
          }
          Path(os.environ["API_KEY_JSON"]).write_text(json.dumps(payload))
          PY

      - name: Archive app
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/StayCheckIQ.xcarchive"
          xcodebuild \
            -project "StayCheckIQ.xcodeproj" \
            -scheme "StayCheck IQ" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export IPA
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          EXPORT_PATH="$RUNNER_TEMP/export"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          IPA_PATH="$(find "$EXPORT_PATH" -name "*.ipa" -print -quit)"
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Install fastlane
        run: sudo gem install fastlane -NV

      - name: Upload build to App Store Connect
        shell: bash
        run: |
          fastlane pilot upload \
            --api_key_path "$API_KEY_JSON" \
            --app_identifier "$APP_IDENTIFIER" \
            --ipa "$IPA_PATH" \
            --skip_waiting_for_build_processing true

      - name: Upload exported IPA artifact
        if: ${{ always() && env.IPA_PATH != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: StayCheckIQ-AppStore-IPA
          path: ${{ env.IPA_PATH }}
          if-no-files-found: ignore
