name: Submit App Store Review

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  submit:
    name: Submit existing App Store Connect version for review
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required account-gated values
        run: |
          test -n "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}"
          test -n "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          test -n "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}"

      - name: Ensure placeholder phone is not submitted
        run: |
          if grep -R "REQUIRED_REAL_PHONE_NUMBER" AppStoreConnect/Forms/app-review-information.json; then
            echo "Replace REQUIRED_REAL_PHONE_NUMBER in AppStoreConnect/Forms/app-review-information.json before submission."
            exit 1
          fi

      - name: Install fastlane
        run: sudo gem install fastlane -NV

      - name: Submit for App Review
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: fastlane ios submit_for_review
